name: ci

# On every push and pull request: the whole suite on Fedora, with no test skipped; the RPMs and DEBs
# built (their own make test included), their file lists checked and the packages installed and loaded
# by a CLAP and an LV2 scanner; and the release workflow as a dry run. Nothing is signed or published
# here. The build dependencies come from the packaging (dnf builddep, apt-get build-dep), the ones
# Fedora and Debian do not carry from the FreeMixer channel; nothing is pinned or fetched by version.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: make test (fedora:44, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:44
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # main and its history: make completeness reads the debt at the merge-base

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install what the spec builds and tests with
        run: dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      - name: The version agrees everywhere it is written
        id: handback-version
        run: |
          set -euo pipefail
          v=$(make -s version)
          grep -q "^Version: $v\$" packaging/omx-plugins.spec
          head -1 debian/changelog | grep -q "^omx-plugins ($v) "

      - name: The packaging declares each dependency's range once, the same for RPM and DEB
        id: handback-deps
        run: |
          set -euo pipefail
          tools/deps-check.sh
          tools/deps-check.sh --self-test

      - name: Every source file carries its SPDX line
        id: handback-spdx
        run: tools/spdx-check.sh

      - name: No tracked file points into a private repository
        id: handback-private-refs
        run: make private-refs

      - name: No source carries a copy of a function omx-dsp exports, and a planted copy goes red
        id: handback-dsp-copies
        run: make dsp-copies

      - name: Every generated file is fresh, built or not
        id: handback-gen
        run: |
          set -euo pipefail
          node tools/gen.mjs --check
          node tools/look.mjs --check
          node tools/gen-presets.mjs --check

      - name: make test, and nothing skipped
        id: handback-test
        run: |
          set -euo pipefail
          make test 2>&1 | tee test.log
          if grep -E '^SKIP' test.log; then echo "::error::a test was skipped"; exit 1; fi

      - name: Every plugin has every artifact of the plugin recipe
        id: handback-completeness
        run: make completeness

      - name: include/omx_meter_ring.h never hands a reader two blocks at once, and each sabotage goes red
        id: handback-meter-ring
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False gcc
          make meter-ring

  selftest:
    # Its own job, beside make test: the two together outgrew one job's 30 minutes once the chain and the
    # compressor landed. Same container and dependencies; nothing is dropped.
    name: make selftest (fedora:44, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:44
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install what the spec builds and tests with
        run: dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      - name: The recipe machinery, sabotaged arm by arm
        id: handback-selftest
        run: make selftest

  rpm:
    name: omx-plugins RPMs (fc44, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]  # aarch64 builds run at release only (release.yml)
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils

      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          for sub in clap lv2; do
            rpm=$(ls rpms/omx-plugins-$sub-[0-9]*.${{ matrix.arch }}.rpm)
            rpm -qlp "$rpm" | grep -v '^/usr/lib/.build-id' | sort > files-$sub.txt
          done
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq keyed-gate limiter phaser pitch reverb rotary strip transient tremolo"
          kernels="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq gate limiter phaser pitch reverb rotary strip transient tremolo"
          tests="org.openmixer.test-note-echo org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          { printf '%s\n' /usr/lib/clap /usr/share/doc/omx-plugins-clap /usr/share/doc/omx-plugins-clap/README.md \
              /usr/share/licenses/omx-plugins-clap /usr/share/licenses/omx-plugins-clap/LICENSE
            for p in $shorts; do echo "/usr/lib/clap/omx-$p.clap"; done; } | sort > expected-clap.txt
          diff -u expected-clap.txt files-clap.txt
          # the test instruments: omx-plugins-test, outside every CLAP search path
          rpm -qlp rpms/omx-plugins-test-[0-9]*.${{ matrix.arch }}.rpm | grep -v '^/usr/lib/.build-id' | sort > files-test.txt
          { printf '%s\n' /usr/libexec/omx-plugins /usr/libexec/omx-plugins/test \
              /usr/share/licenses/omx-plugins-test /usr/share/licenses/omx-plugins-test/LICENSE
            for t in $teststems; do echo "/usr/libexec/omx-plugins/test/$t.clap"; done; } | sort > expected-test.txt
          diff -u expected-test.txt files-test.txt
          devel=$(find rpms -maxdepth 1 -name "omx-plugins-devel-[0-9]*.rpm" ! -name "*.src.rpm" | head -1)
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_delay_core.h
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_plugin_param.h
          for k in $kernels; do rpm -qlp "$devel" | grep -qx "/usr/include/omx-plugins/omx_${k}_params.h"; done
          for f in /usr/include/omx-plugins/omx_clap_static.h /usr/lib64/libomxplugins.a /usr/lib64/pkgconfig/omxplugins.pc; do
            rpm -qlp "$devel" | grep -qx "$f"
          done
          # one descriptor per shipped plugin that has one, in omx-contract's contract directory, with its manifest: in
          # omx-plugins-contract, a package of their own that the metapackage and the devel package require at their
          # version, read at run time with no -devel installed
          cdir=/usr/share/omx-contract/contract.d/3/omx-plugins
          rpm -qlp rpms/omx-plugins-contract-[0-9]*.noarch.rpm | sort > files-contract.txt
          { printf '%s\n' "$cdir" "$cdir/MANIFEST.json" "$cdir/plugins" \
              /usr/share/licenses/omx-plugins-contract /usr/share/licenses/omx-plugins-contract/LICENSE
            for d in plugins/*/*.descriptor.json; do echo "$cdir/plugins/$(basename "$d" .descriptor.json).json"; done; } | sort > expected-contract.txt
          diff -u expected-contract.txt files-contract.txt
          ! rpm -qlp "$devel" | grep -q '^/usr/share/omx-contract/'
          version=$(sed -n 's/^Version: *//p' packaging/omx-plugins.spec)
          for rpm in rpms/omx-plugins-[0-9]*.${{ matrix.arch }}.rpm "$devel"; do
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -qx "omx-plugins-contract = $version-.*" requires.txt
          done
          # a test plugin's generated declaration (the constants and CLAP id a proof predicts from)
          for t in test-note-echo test-sine-voice test-transport-probe; do
            rpm -qlp "$devel" | grep -qx "/usr/include/omx-plugins/omx_${t//-/_}_decl.h"
          done
          for p in $shorts; do
            for f in "omx-$p.so" manifest.ttl "omx-$p.ttl"; do grep -qx "/usr/lib64/lv2/omx-$p.lv2/$f" files-lv2.txt; done
          done
          ! grep -vE "^/usr/lib64/lv2/omx-($(tr ' ' '|' <<<"$shorts"))\.lv2(/|\$)|^/usr/share/(doc|licenses)/omx-plugins-lv2(/|\$)" files-lv2.txt

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # the metapackage, with both formats beside it as the repository would offer them
          dnf install -y --setopt=install_weak_deps=False rpms/omx-plugins-[0-9]*.${{ matrix.arch }}.rpm \
            rpms/omx-plugins-clap-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-plugins-lv2-[0-9]*.${{ matrix.arch }}.rpm \
            rpms/omx-plugins-contract-[0-9]*.noarch.rpm
          # the descriptors come with the metapackage, no -devel installed
          rpm -qf /usr/share/omx-contract/contract.d/3/omx-plugins/MANIFEST.json | grep -q '^omx-plugins-contract-'
          ! rpm -q omx-plugins-devel
          req=$(rpm -q --requires omx-plugins)
          grep -qE '^omx-plugins-clap\([a-z0-9-]+\) = ' <<<"$req"
          grep -qE '^omx-plugins-lv2\([a-z0-9-]+\) = ' <<<"$req"
          # the metapackage carries the factory presets, one file per preset
          out=$(rpm -ql omx-plugins); grep -qx /usr/share/omx/presets/org.openmixer.drive/amp-tube.json <<<"$out"
          test "$(grep -c '^/usr/share/omx/presets/.*\.json$' <<<"$out")" = "$(find presets -name '*.json' | wc -l)"
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq keyed-gate limiter phaser pitch reverb rotary strip transient tremolo"
          kernels="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq gate limiter phaser pitch reverb rotary strip transient tremolo"
          tests="org.openmixer.test-note-echo org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          for p in $shorts; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done
          # the test instruments open by path from outside the CLAP path, each with its id
          dnf install -y --setopt=install_weak_deps=False rpms/omx-plugins-test-[0-9]*.${{ matrix.arch }}.rpm
          for t in $teststems; do
            out=$(omx-clap-scan --json /usr/libexec/omx-plugins/test/$t.clap); grep -q "\"id\":\"org.openmixer.${t#omx-}\"" <<<"$out"
          done

      - name: The devel package's libomxplugins links and opens every plugin in-process
        run: |
          set -euo pipefail
          devel=$(find rpms -maxdepth 1 -name "omx-plugins-devel-[0-9]*.rpm" ! -name "*.src.rpm" | head -1)
          dnf install -y --setopt=install_weak_deps=False "$devel" rpms/omx-plugins-contract-[0-9]*.noarch.rpm
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq keyed-gate limiter phaser pitch reverb rotary strip transient tremolo"
          kernels="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq gate limiter phaser pitch reverb rotary strip transient tremolo"
          tests="org.openmixer.test-note-echo org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          gcc -o static-table-host tools/test/static-table-host.c $(pkg-config --cflags --libs omxplugins)
          ./static-table-host $(for p in $shorts; do echo "org.openmixer.$p"; done) --test $tests

      # Not named omx-plugins-rpms-*: the release dry run in this same run downloads that pattern
      # with merge-multiple, and two builds of one NEVRA collide in one directory.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-check-omx-plugins-fc44-${{ matrix.arch }}
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: omx-plugins DEBs (${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64]  # arm64 builds run at release only (release.yml)
    container:
      image: debian:${{ matrix.suite }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1
        with:
          names: clap-headers

      - name: Take build dependencies from the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # the metapackage, with both formats beside it as the repository would offer them
          apt-get install -y --no-install-recommends ./debs/omx-plugins_*.deb ./debs/omx-plugins-clap_*.deb ./debs/omx-plugins-lv2_*.deb \
            ./debs/omx-plugins-contract_*_all.deb
          dev=$(dpkg -c debs/omx-plugins-dev_*.deb); grep -q './usr/include/omx-plugins/omx_delay_core.h' <<<"$dev"
          grep -q './usr/include/omx-plugins/omx_clap_static.h' <<<"$dev"
          grep -qE '\./usr/lib/[^/]+/libomxplugins\.a$' <<<"$dev"
          grep -qE '\./usr/lib/[^/]+/pkgconfig/omxplugins\.pc$' <<<"$dev"
          ! grep -q '\./usr/share/omx-contract/' <<<"$dev"
          # the descriptors are omx-plugins-contract's, which the metapackage and the dev package depend on at this
          # version, installed here with no -dev
          out=$(dpkg -L omx-plugins-contract)
          grep -qx /usr/share/omx-contract/contract.d/3/omx-plugins/MANIFEST.json <<<"$out"
          test "$(grep -cE '^/usr/share/omx-contract/contract\.d/3/omx-plugins/plugins/[^/]+\.json$' <<<"$out")" = "$(ls plugins/*/*.descriptor.json | wc -l)"
          ! dpkg -s omx-plugins-dev >/dev/null 2>&1
          info=$(dpkg -I debs/omx-plugins-contract_*_all.deb)
          grep -qE '^ Architecture: all$' <<<"$info"
          grep -qE '^ Breaks: omx-plugins-dev \(<< ' <<<"$info"
          grep -qE '^ Replaces: omx-plugins-dev \(<< ' <<<"$info"
          for deb in debs/omx-plugins_*.deb debs/omx-plugins-dev_*.deb; do
            info=$(dpkg -I "$deb"); grep -qE '^ Depends:.*omx-plugins-contract \(= ' <<<"$info"
          done
          dep=$(dpkg -s omx-plugins); grep -q '^Depends: omx-plugins-clap (= .*), omx-plugins-lv2 (= .*)' <<<"$dep"
          # the metapackage carries the factory presets, one file per preset
          out=$(dpkg -L omx-plugins); grep -qx /usr/share/omx/presets/org.openmixer.drive/amp-tube.json <<<"$out"
          test "$(grep -c '^/usr/share/omx/presets/.*\.json$' <<<"$out")" = "$(find presets -name '*.json' | wc -l)"
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq keyed-gate limiter phaser pitch reverb rotary strip transient tremolo"
          kernels="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq gate limiter phaser pitch reverb rotary strip transient tremolo"
          tests="org.openmixer.test-note-echo org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          for p in $shorts; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(dpkg -L omx-plugins-clap); grep -qx "/usr/lib/clap/omx-$p.clap" <<<"$out"
            out=$(dpkg -L omx-plugins-lv2); grep -qx "/usr/lib/lv2/omx-$p.lv2/omx-$p.so" <<<"$out"
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done
          # the test instruments open by path from outside the CLAP path, each with its id
          apt-get install -y --no-install-recommends ./debs/omx-plugins-test_*.deb
          for t in $teststems; do
            out=$(dpkg -L omx-plugins-test); grep -qx "/usr/libexec/omx-plugins/test/$t.clap" <<<"$out"
            out=$(omx-clap-scan --json /usr/libexec/omx-plugins/test/$t.clap); grep -q "\"id\":\"org.openmixer.${t#omx-}\"" <<<"$out"
          done
          out=$(dpkg -L omx-plugins-test)
          if grep -q '^/usr/lib/clap' <<<"$out"; then echo "omx-plugins-test puts a file in the CLAP path"; exit 1; fi

      - name: The dev package's libomxplugins links and opens every plugin in-process
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/omx-plugins-dev_*.deb
          # BEGIN GENERATED plugins: tools/gen.mjs, the shipped plugins' short names and kernels, the test plugins' ids
          shorts="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq keyed-gate limiter phaser pitch reverb rotary strip transient tremolo"
          kernels="chorus comp deesser delay drive eq8 eq16 eq32 flanger geq gate limiter phaser pitch reverb rotary strip transient tremolo"
          tests="org.openmixer.test-note-echo org.openmixer.test-sine-voice org.openmixer.test-transport-probe"
          teststems="omx-test-note-echo omx-test-sine-voice omx-test-transport-probe"
          # END GENERATED plugins
          gcc -o static-table-host tools/test/static-table-host.c $(pkg-config --cflags --libs omxplugins)
          ./static-table-host $(for p in $shorts; do echo "org.openmixer.$p"; done) --test $tests

  clap-validator:
    # clap-validator is the CLAP project's own conformance tester (state round trips, parameter fuzzing,
    # thread rules). It runs on every built .clap, the test plugins included, and keeps one JSON report each.
    # Until every plugin is clean a failed test is reported (a warning, the job summary, the report artifact)
    # and does not fail the job; the step is made required, continue-on-error removed, once they pass.
    # The state tests are required: the step after the summary fails the job on any of them.
    name: clap-validator (fedora:44, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins

      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: actions/checkout@v4

      - name: Install what the spec builds with, and clap-validator from the Audinux COPR
        run: |
          set -euo pipefail
          dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec
          dnf copr enable -y ycollet/audinux
          dnf install -y --setopt=install_weak_deps=False clap-validator nodejs

      - name: Build every plugin
        run: make -j"$(nproc)" all

      - name: Validate every built .clap
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build
          tools/clap-validate.sh build/clap-validator 2>&1 | tee build/clap-validator.log
        shell: bash

      - name: Show the failures on the run page
        if: always()
        run: |
          {
            echo '### clap-validator'
            echo '```'
            grep -E '^(omx-|  FAIL|FAIL)' build/clap-validator.log || echo 'no failed test'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.validate.outcome }}" = failure ]; then
            echo "::warning::clap-validator reported failures (not yet required); see the job summary and the report artifact"
          fi

      - name: The state tests are required
        # every plugin's state round trip (state-reproducibility-*, state-invalid-*) must pass; the
        # repo's own test of it is `clap-probe state`, in every plugin's make test
        run: node tools/clap-validate-required.mjs build/clap-validator state-

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clap-validator-reports
          path: |
            build/clap-validator/
            build/clap-validator.log
          if-no-files-found: error
          retention-days: 30

  release-dry-run:
    name: release workflow, dry run
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # arm64/aarch64 build at release only

  # A commit message is published like a file. A pull request's own commits must carry no
  # AI-attribution line (tools/ai-trace-commit-check.sh); what is already on the base is not read.
  ai-trace:
    name: commit messages carry no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The checker catches a fixture and goes blind when its patterns are removed
        run: tools/ai-trace-commit-check.sh --selftest
      - name: Scan the commits of the pull request
        run: tools/ai-trace-commit-check.sh origin/${{ github.event.pull_request.base.ref }}..HEAD
