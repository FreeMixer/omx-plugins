name: ci

# On every push and pull request: the whole suite on Fedora, with no test skipped; the RPMs and DEBs
# built (their own make test included), their file lists checked and the packages installed and loaded
# by a CLAP and an LV2 scanner; and the release workflow as a dry run. Nothing is signed or published
# here. The build dependencies Fedora and Debian do not carry come from the FreeMixer channel.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG.md agrees with the spec and debian/changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/changelog@v1

  test:
    name: make test (fedora:44, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins
          dnf config-manager addrepo --from-repofile=https://freemixer.github.io/rpm/freemixer.repo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # main and its history: make completeness reads the debt at the merge-base

      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install what the spec builds and tests with
        run: dnf builddep -y --setopt=install_weak_deps=False packaging/omx-plugins.spec

      - name: The version agrees everywhere it is written
        id: handback-version
        run: |
          set -euo pipefail
          v=$(make -s version)
          grep -q "^Version: $v\$" packaging/omx-plugins.spec
          head -1 debian/changelog | grep -q "^omx-plugins ($v) "

      - name: The pins agree with the packaging and with what omx-dsp requires
        id: handback-pins
        run: |
          set -euo pipefail
          tools/pins-check.sh
          tools/pins-check.sh --self-test

      - name: Every source file carries its SPDX line
        id: handback-spdx
        run: tools/spdx-check.sh

      - name: Every generated file is fresh, built or not
        id: handback-gen
        run: node tools/gen.mjs --check

      - name: make test, and nothing skipped
        id: handback-test
        run: |
          set -euo pipefail
          make test 2>&1 | tee test.log
          if grep -E '^SKIP' test.log; then echo "::error::a test was skipped"; exit 1; fi

      - name: The recipe machinery, sabotaged arm by arm
        id: handback-selftest
        run: make selftest

      - name: Every plugin has every artifact of the plugin recipe
        id: handback-completeness
        run: make completeness

  rpm:
    name: omx-plugins RPMs (fc44, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]  # aarch64 builds run at release only (release.yml)
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils
          dnf config-manager addrepo --from-repofile=https://freemixer.github.io/rpm/freemixer.repo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          for sub in clap lv2; do
            rpm=$(ls rpms/omx-plugins-$sub-[0-9]*.${{ matrix.arch }}.rpm)
            rpm -qlp "$rpm" | grep -v '^/usr/lib/.build-id' | sort > files-$sub.txt
          done
          printf '%s\n' /usr/lib/clap /usr/lib/clap/omx-delay.clap /usr/lib/clap/omx-drive.clap \
            /usr/lib/clap/omx-eq8.clap /usr/lib/clap/omx-eq16.clap /usr/lib/clap/omx-eq32.clap \
            /usr/lib/clap/omx-keyed-gate.clap /usr/lib/clap/omx-strip.clap /usr/lib/clap/omx-phaser.clap \
            /usr/share/doc/omx-plugins-clap /usr/share/doc/omx-plugins-clap/README.md \
            /usr/share/licenses/omx-plugins-clap /usr/share/licenses/omx-plugins-clap/LICENSE | sort > expected-clap.txt
          diff -u expected-clap.txt files-clap.txt
          devel=$(find rpms -maxdepth 1 -name "omx-plugins-devel-[0-9]*.rpm" ! -name "*.src.rpm" | head -1)
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_delay_instance.h
          rpm -qlp "$devel" | grep -qx /usr/include/omx-plugins/omx_plugin_param.h
          for p in delay drive eq8 eq16 eq32 gate strip phaser; do rpm -qlp "$devel" | grep -qx "/usr/include/omx-plugins/omx_${p}_params.h"; done
          for p in omx-delay omx-drive omx-eq8 omx-eq16 omx-eq32 omx-keyed-gate omx-strip omx-phaser; do
            for f in "$p.so" manifest.ttl "$p.ttl"; do grep -qx "/usr/lib64/lv2/$p.lv2/$f" files-lv2.txt; done
          done
          ! grep -vE '^/usr/lib64/lv2/omx-(delay|drive|eq8|eq16|eq32|keyed-gate|strip|phaser)\.lv2(/|$)|^/usr/share/(doc|licenses)/omx-plugins-lv2(/|$)' files-lv2.txt

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # the metapackage, with both formats beside it as the repository would offer them
          dnf install -y --setopt=install_weak_deps=False rpms/omx-plugins-[0-9]*.${{ matrix.arch }}.rpm \
            rpms/omx-plugins-clap-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-plugins-lv2-[0-9]*.${{ matrix.arch }}.rpm
          req=$(rpm -q --requires omx-plugins)
          grep -qE '^omx-plugins-clap\([a-z0-9-]+\) = ' <<<"$req"
          grep -qE '^omx-plugins-lv2\([a-z0-9-]+\) = ' <<<"$req"
          for p in delay drive eq8 eq16 eq32 keyed-gate strip; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done

      # Not named omx-plugins-rpms-*: the release dry run in this same run downloads that pattern
      # with merge-multiple, and two builds of one NEVRA collide in one directory.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-check-omx-plugins-fc44-${{ matrix.arch }}
          path: rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: omx-plugins DEBs (${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64]  # arm64 builds run at release only (release.yml)
    container:
      image: debian:${{ matrix.suite }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1
        with:
          names: clap-headers

      - name: Take build dependencies from the FreeMixer channel
        env:
          URL: https://freemixer.github.io/deb
          SUITE: ${{ matrix.suite }}
        run: |
          install -d /etc/apt/keyrings
          curl -fsSL -o /etc/apt/keyrings/freemixer.asc "$URL/freemixer.asc"
          echo "deb [signed-by=/etc/apt/keyrings/freemixer.asc] $URL/debian/$SUITE ./" > /etc/apt/sources.list.d/freemixer.list
          apt-get update -qq

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      - name: The packages install and their plugins load
        run: |
          set -euo pipefail
          # the metapackage, with both formats beside it as the repository would offer them
          apt-get install -y --no-install-recommends ./debs/omx-plugins_*.deb ./debs/omx-plugins-clap_*.deb ./debs/omx-plugins-lv2_*.deb
          dev=$(dpkg -c debs/omx-plugins-dev_*.deb); grep -q './usr/include/omx-plugins/omx_delay_instance.h' <<<"$dev"
          dep=$(dpkg -s omx-plugins); grep -q '^Depends: omx-plugins-clap (= .*), omx-plugins-lv2 (= .*)' <<<"$dep"
          for p in delay drive eq8 eq16 eq32 keyed-gate strip; do
            # captured first: grep -q leaving a pipe early would fail the step under pipefail
            out=$(dpkg -L omx-plugins-clap); grep -qx "/usr/lib/clap/omx-$p.clap" <<<"$out"
            out=$(dpkg -L omx-plugins-lv2); grep -qx "/usr/lib/lv2/omx-$p.lv2/omx-$p.so" <<<"$out"
            out=$(omx-clap-scan --json /usr/lib/clap/omx-$p.clap); grep -q "\"id\":\"org.openmixer.$p\"" <<<"$out"
            out=$(lv2ls); grep -qx "urn:openmixer:$p" <<<"$out"
            out=$(lv2info "urn:openmixer:$p"); grep -q 'Binary:' <<<"$out"
          done

  release-dry-run:
    name: release workflow, dry run
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # arm64/aarch64 build at release only
